<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SwiftEdge Trade">
  <title>SwiftEdge Trade</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4361ee"/>
      <stop offset="1" stop-color="#7209b7"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile in the site's brand gradient -->
  <rect width="512" height="512" rx="116" fill="url(#brand)"/>

  <!-- Rising trend line: reads as growth/trading even at 16px -->
  <path d="M104 348 L200 252 L280 332 L400 188"
        fill="none" stroke="#ffffff" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrowhead bracket closing the line at the top right -->
  <path d="M326 188 L400 188 L400 262"
        fill="none" stroke="#ffffff" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
